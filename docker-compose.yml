services:
  db:
    image: postgres:17.6
    container_name: reviewer_postgres
    environment:
      POSTGRES_DB: reviewer
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: reviewer_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://reviewer:reviewer@db:5432/reviewer
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
